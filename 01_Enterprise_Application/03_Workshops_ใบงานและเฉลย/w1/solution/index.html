<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electrical Meter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Electrical Meter</h1>
    <p class="sub">Real-time Voltage &amp; Current</p>
  </header>

  <main>
    <section class="cards">
      <article class="card">
        <p class="label">Voltage</p>
        <p class="value voltage"><span id="voltage">230</span> <span class="unit">V</span></p>
      </article>
      <article class="card">
        <p class="label">Current</p>
        <p class="value current"><span id="current">15.8</span> <span class="unit">A</span></p>
      </article>
    </section>
  </main>
</body>
</html>
