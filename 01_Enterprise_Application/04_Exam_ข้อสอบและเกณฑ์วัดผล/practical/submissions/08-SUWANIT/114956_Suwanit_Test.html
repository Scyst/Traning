<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สอบปฏิบัติ: Electrical Meter Alert</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: "Leelawadee UI", Tahoma, sans-serif;
      background: #111827;
      color: #e5e7eb;
    }

    header, main {
      max-width: 960px;
      margin: 0 auto;
    }

    header h1 { margin: 0; font-size: 26px; }
    .sub { margin: 4px 0 20px; color: #9ca3af; }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      flex: 1 1 200px;
      padding: 18px;
      border-radius: 10px;
      background: #1f2937;
      border: 1px solid #374151;
    }

    .label { margin: 0; color: #9ca3af; font-size: 14px; }
    .value { margin: 8px 0 0; font-size: 34px; font-weight: 700; }
    .unit { font-size: 16px; color: #9ca3af; font-weight: 400; }
    .voltage { color: #facc15; }
    .current { color: #38bdf8; }
    .water { color: #34d399; }
    .power { color: #c084fc; }

    .panel {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 20px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      background: #374151;
      color: #f9fafb;
    }
    .badge.ok { background: #22c55e; color: #052e16; }
    .badge.warn { background: #eab308; color: #422006; }
    .badge.bad { background: #ef4444; color: #ffffff; }
    .badge.blue { background: #38bdf8; color: #082f49; }

    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
    .input-group input {
      width: 100%;
      max-width: 340px;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #f9fafb;
      font: inherit;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    button {
      min-height: 44px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }

    .auto-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      cursor: pointer;
    }

    .note { margin: 12px 0 0; color: #9ca3af; font-size: 14px; }
    .note.error { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <h1>Electrical Meter Alert</h1>
    <p class="sub">ระบบติดตามค่ามิเตอร์และแจ้งเตือนความผิดปกติ</p>
  </header>

  <main>
    <!-- การ์ดแสดงค่ามิเตอร์ -->
    <section class="cards">
      <article class="card">
        <p class="label">Voltage (แรงดัน)</p>
        <p class="value voltage"><span id="voltage">–</span> <span class="unit">V</span></p>
      </article>
      <article class="card">
        <p class="label">Current (กระแส)</p>
        <p class="value current"><span id="current">–</span> <span class="unit">A</span></p>
      </article>
      <article class="card">
        <p class="label">Water Flow (น้ำไหล)</p>
        <p class="value water"><span id="water">–</span> <span class="unit">m³/h</span></p>
      </article>
      <article class="card">
        <p class="label">Power (กำลังไฟฟ้า = V × A)</p>
        <p class="value power"><span id="power">–</span> <span class="unit">W</span></p>
      </article>
    </section>

    <!-- แผงสถานะและปุ่มตรวจสอบ -->
    <section class="panel">
      <div class="status-row">
        <span class="label">สถานะเครื่องจักร</span>
        <span id="status" class="badge">รอตรวจสอบ</span>
      </div>

      <div class="input-group">
        <label for="student-name">ชื่อผู้ส่งแจ้งเตือน (เลขที่-ชื่อ เช่น 01-สมชาย)</label>
        <input id="student-name" type="text" placeholder="ระบุเลขที่-ชื่อ เช่น 01-สมชาย">
      </div>

      <div class="buttons">
        <button id="check-btn" type="button" onclick="checkMachine()">ดึงข้อมูลและตรวจสอบ</button>
        <label class="auto-box">
          <input id="auto-toggle" type="checkbox" onchange="toggleAuto(this)">
          <span>ตรวจอัตโนมัติทุก 5 วินาที</span>
        </label>
      </div>

      <p id="updated" class="note">ยังไม่ได้ดึงข้อมูล</p>
      <p id="notify-result" class="note"></p>
    </section>
  </main>

  <script>
    // ข้อสอบปฏิบัติ: Electrical Meter Alert (แก้ไขในจุด TODO 1 ถึง TODO 5)

    // TODO 1 (10 คะแนน): ใส่ API_URL, WEBHOOK_URL และชื่อผู้สอบ (เช่น '01-สมชาย')
    const API_URL = 'http://10.1.9.112:8000/api/meter';
    const WEBHOOK_URL = 'http://10.1.9.112:8000/api/notify';
    const STUDENT_NAME = '08-SUWANIT';

    // เกณฑ์มาตรฐานสำหรับตรวจสอบเงื่อนไข
    const MAX_VOLTAGE = 240;     // V
    const MAX_CURRENT = 20;      // A
    const MIN_WATER = 1.5;       // m3/h

    let lastSentCondition = '';  // เก็บสถานะล่าสุดที่ส่งแจ้งเตือนแล้ว
    let autoTimer = null;

    // ฟังก์ชันหลักสำหรับดึงค่าและเรียกตรวจตามลำดับ (ส่วนนี้ไม่ต้องแก้ไข)
    async function checkMachine() {
      const updatedEl = document.getElementById('updated');
      if (!API_URL) {
        updatedEl.innerText = 'กรุณากำหนด API_URL ใน TODO 1 ก่อน';
        updatedEl.classList.add('error');
        return;
      }

      try {
        const res = await fetch(API_URL);
        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }
        const data = await res.json();

        // แสดงค่าบนการ์ด (TODO 2 และ TODO 3)
        showMeterValues(data);

        // ตรวจเงื่อนไข (TODO 4) แล้วอัปเดตป้ายสถานะ
        const voltage = data.electric.voltage;
        const current = data.electric.current;
        const water = data.water.flow;
        const condition = checkCondition(voltage, current, water);

        updateStatusBadge(condition);

        // ส่งแจ้งเตือนเมื่อพบค่าผิดปกติ (TODO 5)
        await handleAlert(condition, voltage, current, water);

        updatedEl.innerText = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH');
        updatedEl.classList.remove('error');
      } catch (err) {
        updatedEl.innerText = 'โหลดข้อมูลจาก API ไม่สำเร็จ';
        updatedEl.classList.add('error');
        console.error(err);
      }
    }

    // TODO 3 (10 คะแนน): คำนวณและคืนค่ากำลังไฟฟ้า (หน่วย W)
    function calcPower(voltage, current) {
      return voltage * current;
    }

    // TODO 2 (10 คะแนน): นำค่า voltage, current และ water flow จาก data มาแสดงในหน้าเว็บ
    // โครงสร้างข้อมูล API: data.electric.voltage, data.electric.current, data.water.flow
    function showMeterValues(data) {
      const voltage = data.electric.voltage;
      const current = data.electric.current;
      const water = data.water.flow;

      document.getElementById('voltage').innerText = data.electric.voltage;
      document.getElementById('current').innerText = data.electric.current;
      document.getElementById('water').innerText = data.water.flow;


      const power = calcPower(data.electric.voltage, data.electric.current);
      document.getElementById('power').innerText = power.toFixed(0);
    }

    // TODO 4 (10 คะแนน): ตรวจสอบเงื่อนไขและคืนค่าสถานะ
    // ค่าที่ต้องคืน: 'over_volt' (>240V), 'over_curr' (>20A), 'low_water' (<1.5), หรือ 'normal'
    function checkCondition(voltage, current, water) {
      if (voltage > MAX_VOLTAGE) {
      return 'over_volt';
      } else if (current > MAX_CURRENT) {
      return 'over_curr';
      } else if (water < MIN_WATER) {
      return 'low_water';
      }
      return 'normal';
    }

    function updateStatusBadge(condition) {
      const badge = document.getElementById('status');
      if (condition === 'over_volt') {
        badge.innerText = 'แรงดันเกิน (> 240 V)';
        badge.className = 'badge bad';
      } else if (condition === 'over_curr') {
        badge.innerText = 'กระแสเกิน (> 20 A)';
        badge.className = 'badge warn';
      } else if (condition === 'low_water') {
        badge.innerText = 'น้ำไหลต่ำ (< 1.5)';
        badge.className = 'badge blue';
      } else {
        badge.innerText = 'ปกติ';
        badge.className = 'badge ok';
      }
    }

    // TODO 5 (10 คะแนน): ส่งแจ้งเตือนแบบ POST ไปที่ WEBHOOK_URL เมื่อสถานะผิดปกติ
    // ส่ง JSON { sender, condition, title, message } และเช็ก lastSentCondition เพื่อไม่ให้ส่งซ้ำเมื่อสถานะเดิมค้างอยู่
    async function handleAlert(condition, voltage, current, water) {
      const resultEl = document.getElementById('notify-result');
      if (condition === 'normal') {
        lastSentCondition = '';
        resultEl.innerText = 'สถานะปกติ (ไม่ต้องส่งแจ้งเตือน)';
        return;
      }
      if (lastSentCondition === condition) {
      resultEl.innerText = 'ส่งแจ้งเตือนไปแล้ว (สถานะเดิมค้างอยู่)';
      return;
      }

      const senderInput = document.getElementById('student-name');
      const sender = senderInput ? senderInput.value : STUDENT_NAME;
      let title = '';
      let message = '';

      if (condition === 'over_volt') {
      title = 'แจ้งเตือน: แรงดันไฟฟ้าเกินกำหนด';
      message = `แรงดันไฟฟ้าปัจจุบันคือ ${voltage} V เกินกว่าเกณฑ์ ${MAX_VOLTAGE} V`;
      } else if (condition === 'over_curr') {
      title = 'แจ้งเตือน: กระแสไฟฟ้าเกินกำหนด';
      message = `กระแสไฟฟ้าปัจจุบันคือ ${current} A เกินกว่าเกณฑ์ ${MAX_CURRENT} A`;
      } else if (condition === 'low_water') {
      title = 'แจ้งเตือน: อัตราการไหลของน้ำต่ำกว่ากำหนด';
      message = `อัตราการไหลของน้ำปัจจุบันคือ ${water} m³/h ต่ำกว่าเกณฑ์ ${MIN_WATER} m³/h`;
      }

      try {
      const response = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {
      'Content-Type': 'application/json'
      },
      body: JSON.stringify({
      sender: sender,
      condition: condition,
      title: title,
      message: message
      })
      });

      if (!response.ok) {
      throw new Error('HTTP ' + response.status);
      }

      lastSentCondition = condition;
      resultEl.innerText = 'ส่งแจ้งเตือนสำเร็จ (' + new Date().toLocaleTimeString('th-TH') + ')';
      resultEl.classList.remove('error');
      } catch (err) {
      resultEl.innerText = 'ส่งแจ้งเตือนไม่สำเร็จ';
      resultEl.classList.add('error');
      console.error(err);
      }

      // เขียนโค้ดส่งแจ้งเตือนต่อจากตรงนี้

    }

    // เปิด-ปิดโหมดตรวจสอบอัตโนมัติ (ไม่ต้องแก้ไข)
    function toggleAuto(checkbox) {
      if (checkbox.checked) {
        checkMachine();
        autoTimer = setInterval(checkMachine, 5000);
      } else {
        clearInterval(autoTimer);
        autoTimer = null;
      }
    }

    // เติมชื่อจาก STUDENT_NAME ลงในช่อง input ถ้ามีการกำหนดไว้
    const nameInput = document.getElementById('student-name');
    if (nameInput && !nameInput.value && STUDENT_NAME) {
      nameInput.value = STUDENT_NAME;
    }
  </script>
</body>
</html>
